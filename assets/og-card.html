<!DOCTYPE html>
<!-- Source for og.png (social unfurl card). Render at exactly 1200×630, e.g.:
     playwright screenshot --viewport-size=1200,630 assets/og-card.html og.png -->
<html>
<head>
<meta charset="utf-8" />
<style>
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    background: #07080d;
    color: #eceef5;
    font-family: Inter, "Noto Sans", "Helvetica Neue", Arial, sans-serif;
    position: relative;
  }
  .glow {
    position: absolute; inset: 0;
    background:
      radial-gradient(700px 420px at 8% -10%, rgba(124, 92, 255, 0.38), transparent 60%),
      radial-gradient(620px 420px at 100% 0%, rgba(34, 211, 238, 0.22), transparent 60%),
      radial-gradient(700px 500px at 75% 115%, rgba(124, 92, 255, 0.22), transparent 60%);
  }
  .grid {
    position: absolute; inset: 0; opacity: 0.07;
    background-image: linear-gradient(#fff 1px, transparent 1px), linear-gradient(90deg, #fff 1px, transparent 1px);
    background-size: 40px 40px;
    mask-image: radial-gradient(ellipse at 70% 50%, #000 20%, transparent 70%);
  }
  .wrap { position: relative; height: 100%; padding: 64px 72px; display: flex; flex-direction: column; }
  .brand { display: flex; align-items: center; gap: 16px; font-weight: 800; font-size: 34px; letter-spacing: -0.02em; }
  .logo {
    width: 52px; height: 52px; border-radius: 14px; display: grid; place-items: center;
    background: linear-gradient(135deg, #7c5cff, #22d3ee); box-shadow: 0 8px 30px rgba(124, 92, 255, 0.55);
  }
  .eyebrow {
    margin-top: 46px; font-size: 20px; letter-spacing: 0.16em; text-transform: uppercase;
    color: #22d3ee; font-weight: 700;
  }
  h1 { margin-top: 16px; font-size: 56px; line-height: 1.08; letter-spacing: -0.035em; font-weight: 800; }
  .grad { background: linear-gradient(90deg, #a78bfa, #22d3ee); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .sub { margin-top: 22px; font-size: 24px; line-height: 1.4; color: #a3a8bd; max-width: 660px; }
  .sub code { font-family: "Noto Sans Mono", "DejaVu Sans Mono", monospace; color: #c4b5fd; font-size: 23px; }
  .chips { margin-top: auto; display: flex; gap: 12px; }
  .chip {
    font-size: 19px; font-weight: 600; padding: 9px 18px; border-radius: 999px;
    border: 1px solid rgba(255, 255, 255, 0.16); background: rgba(255, 255, 255, 0.04); color: #d6d9e6;
  }
  .chip.v { color: #c4b5fd; border-color: rgba(167, 139, 250, 0.5); background: rgba(124, 92, 255, 0.14); }
  .chip.t { color: #5eead4; border-color: rgba(45, 212, 191, 0.45); background: rgba(45, 212, 191, 0.1); }
  .tree { position: absolute; right: 30px; top: 176px; }
  .tree text { font-family: "Noto Sans Mono", "DejaVu Sans Mono", monospace; text-anchor: middle; dominant-baseline: central; }
</style>
</head>
<body>
  <div class="glow"></div>
  <div class="grid"></div>

  <!-- derivation tree: hidden xpub → m/0/1 (A) and m/1/3 (B) -->
  <svg class="tree" width="300" height="300" viewBox="0 0 300 300">
    <defs>
      <linearGradient id="g" x1="0" x2="1"><stop offset="0" stop-color="#fbbf24" /><stop offset="1" stop-color="#c4b5fd" /></linearGradient>
      <filter id="blur"><feGaussianBlur stdDeviation="6" /></filter>
    </defs>
    <g fill="none" stroke-width="4" stroke-linecap="round">
      <path d="M40,150 C84,150 84,78 128,78" stroke="url(#g)" />
      <path d="M40,150 C84,150 84,222 128,222" stroke="#2dd4bf" />
      <path d="M128,78 L236,78" stroke="#a78bfa" />
      <path d="M128,222 L236,222" stroke="#2dd4bf" />
    </g>
    <circle cx="236" cy="78" r="28" fill="#a78bfa" filter="url(#blur)" opacity="0.7" />
    <circle cx="236" cy="222" r="28" fill="#2dd4bf" filter="url(#blur)" opacity="0.7" />
    <g stroke-width="3.5">
      <circle cx="40" cy="150" r="34" fill="rgba(251,191,36,0.14)" stroke="#fbbf24" stroke-dasharray="7 6" />
      <circle cx="128" cy="78" r="22" fill="#151726" stroke="#c4b5fd" />
      <circle cx="128" cy="222" r="22" fill="#151726" stroke="#2dd4bf" />
      <circle cx="236" cy="78" r="25" fill="#a78bfa" stroke="#a78bfa" />
      <circle cx="236" cy="222" r="25" fill="#2dd4bf" stroke="#2dd4bf" />
    </g>
    <text x="40" y="150" fill="#fbbf24" font-size="17" font-weight="700">xpub</text>
    <text x="40" y="204" fill="#fbbf24" font-size="16" font-family="Noto Sans" font-weight="700">hidden</text>
    <text x="128" y="78" fill="#eceef5" font-size="19">0</text>
    <text x="128" y="222" fill="#eceef5" font-size="19">1</text>
    <text x="236" y="78" fill="#0b0c12" font-size="21" font-weight="800">1</text>
    <text x="236" y="222" fill="#0b0c12" font-size="21" font-weight="800">3</text>
    <text x="236" y="28" fill="#c4b5fd" font-size="17" font-family="Noto Sans" font-weight="700">Key A</text>
    <text x="236" y="274" fill="#5eead4" font-size="17" font-family="Noto Sans" font-weight="700">Key B</text>
  </svg>

  <div class="wrap">
    <div class="brand">
      <div class="logo">
        <svg width="26" height="26" viewBox="0 0 32 32"><path d="M7 7l18 18M25 7L7 25" stroke="#fff" stroke-width="5" stroke-linecap="round" /></svg>
      </div>
      xproof
    </div>
    <div class="eyebrow">Bitcoin · BIP32 · Zero-knowledge</div>
    <h1>Prove two keys share a wallet.<br /><span class="grad">Reveal nothing else.</span></h1>
    <p class="sub">Zero-knowledge proof that <code>m/0/1</code> and <code>m/1/3</code> come from one xpub, without revealing the xpub or the paths.</p>
    <div class="chips">
      <span class="chip v">Runs in your browser</span>
      <span class="chip">UltraHonk · SP1 zkVM</span>
      <span class="chip t">Live on signet</span>
    </div>
  </div>
</body>
</html>
