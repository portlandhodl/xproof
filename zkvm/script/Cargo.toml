[package]
version = "0.1.0"
name = "xproof-host"
edition = "2021"

[dependencies]
sp1-sdk = { version = "6.0.1", features = ["blocking"] }
xproof-lib = { path = "../lib" }
sp1-verifier = "6.10.0"
serde = { version = "1.0.200", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.0", features = ["derive", "env"] }
tracing = "0.1.40"
hex = "0.4.3"
dotenv = "0.15.0"
sha2 = "0.10.8"
axum = { version = "0.8", features = ["http1", "tokio", "json"] }
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["fs", "cors"] }

[build-dependencies]
sp1-build = { version = "6.0.1" }
